name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} / ${{ matrix.os }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # Нижняя граница поддержки — 7.1: на ней держится весь массовый
        # хостинг, который ещё живёт. Проверяем каждую ветку до текущей,
        # иначе «поддерживаем все версии» остаётся словами.
        php: ['7.1', '7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        os: [ubuntu-latest]
        # Крайние версии гоняем ещё и на других системах: тесты транспорта
        # поднимают сокеты и дочерний процесс, а там поведение своё.
        include:
          - php: '7.4'
            os: windows-latest
          - php: '8.5'
            os: windows-latest
          - php: '8.5'
            os: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, curl
          coverage: none

      - run: composer update --prefer-dist --no-interaction --no-progress

      - run: vendor/bin/phpunit
